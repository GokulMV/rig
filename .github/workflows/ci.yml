name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The TypeScript benches' checks run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      # Docker, integration (paid model calls) and models (1.1 GB download) tests are
      # deselected by addopts in pyproject.toml.
      - name: Test
        run: uv run python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
