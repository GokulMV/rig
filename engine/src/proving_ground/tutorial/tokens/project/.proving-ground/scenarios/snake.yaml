id: snake
title: Snake case
kind: typical
instruction: 'Add `snake(text)` to textkit/case.py: the words of the text in lowercase, joined by underscores,
  such as `hello_big_world` for "Hello Big World".'
check: |
  python3 -m unittest -q && python3 - <<'PY'
  from textkit.case import snake
  got = snake("Hello Big World")
  assert got == 'hello_big_world', f'snake("Hello Big World") gave {got!r}'
  got = snake("  one  ")
  assert got == 'one', f'snake("  one  ") gave {got!r}'
  print('ok')
  PY
timeout: 300
check_status: approved
origin: user
